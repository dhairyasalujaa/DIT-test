<!--
  The favicon.

  The same faceted shield-and-play mark as `Logomark` in
  components/layout/wordmark.tsx, at 32px on the brand navy — see that file
  for the sourcing note on why this is a reconstruction rather than a trace
  of the client's actual artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <rect width="100" height="100" rx="18" fill="#0b1a2b"/>
  <defs>
    <mask id="icon-cut">
      <rect x="0" y="0" width="100" height="100" fill="#fff"/>
      <polygon points="42,34 42,66 70,50" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#icon-cut)">
    <polygon points="18,26 66,14 50,50" fill="#0b1a2b"/>
    <polygon points="66,14 90,50 50,50" fill="#007acd"/>
    <polygon points="90,50 64,86 50,50" fill="#007acd"/>
    <polygon points="64,86 18,74 50,50" fill="#42afea"/>
    <polygon points="18,74 18,26 50,50" fill="#42afea"/>
  </g>
</svg>
